name: Bug Report
description: Create a report to help us improve GridAssist
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen.
      placeholder: Describe the bug...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Telemetry Engine
        - Localization Engine
        - Decision Engine
        - Incident / Ticket Manager
        - Operations Theater UI
        - Topology Canvas
        - Simulator Runtime
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output or stack traces.
      render: shell
