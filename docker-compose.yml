version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gridassist-postgres
    restart: always
    environment:
      POSTGRES_USER: gridassist
      POSTGRES_PASSWORD: gridassist_pass
      POSTGRES_DB: gridassist_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridassist -d gridassist_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gridassist-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      CORS_ORIGIN: "*"
      DATABASE_URL: postgresql://gridassist:gridassist_pass@postgres:5432/gridassist_db?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gridassist-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
